services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./rules:/app/rules
      - data-uploads:/app/data

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metrology
      POSTGRES_PASSWORD: metrology
      POSTGRES_DB: metrology
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrology -d metrology"]
      interval: 2s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  data-uploads:
