# Legal Metrology (Packaged Commodities) Rules, 2011 - rule catalog.
# Data, not code: an officer amends thresholds here without a redeploy.
# Each declaration maps to a clause; the engine cites `clause` in every verdict.
#
# Source: official consolidated book (all amendments) - docs/lmpc-2011.pdf,
# Dept of Consumer Affairs. Values below reflect amendments in force,
# principally GSR 629(E) dated 23-06-2017 (w.e.f. 01-01-2018), which replaced
# the net-quantity font bands with area-of-panel bands.

version: "2011 (as amended through 2022)"

# Statutory authority cited in report headers.
statute:
  act: "Legal Metrology Act, 2009"
  section: "Section 18"
  effect: >
    Prohibits manufacture, packing, import, sale, distribution, delivery or
    display for sale of any pre-packaged commodity unless it bears the
    prescribed declarations in the prescribed manner.
  source_url: "https://consumeraffairs.nic.in/"

# Every rule below is stored as versioned data (per legal-review guidance):
# clause + authoritative source + gazette + effective-from + applicability.
# ENGINE CONTRACT: detection is separate from legal conclusion. A field that is
# "not detected in the submitted image" is NOT asserted "legally absent"; such
# items carry a confidence and a mandatory officer_review flag. The system
# reports POTENTIAL non-compliance for verification, never a final legal finding.
meta:
  source_url: "https://consumeraffairs.nic.in/"
  reference_pdf: "docs/lmpc-2011.pdf"
  verify_before_use:
    - "https://iilm.gov.in/more/act-rules"
    - "https://egazette.nic.in/"
  privacy: "DPDP Act, 2023 governs personal/location/officer data."
  disposition: potential_non_compliance   # never 'violation'
  officer_review: required

# --- Rule 6: declarations to be made on every package ---
declarations:
  - id: manufacturer
    label: Name & address of manufacturer / packer / importer
    clause: "Rule 6(1)(a)"
    checks: [present, address_format]
    applicability:
      food:
        not_applicable: true
        law: "Food Safety and Standards Act, 2006"
        clause: "Rule 6(1)(a) Explanation III"

  - id: country_of_origin
    label: Country of origin / manufacture / assembly (imported products)
    clause: "Rule 6(1)(aa)"          # inserted GSR 629(E), w.e.f. 01-01-2018
    checks: [present_if_imported]

  - id: common_name
    label: Common or generic name of the commodity
    clause: "Rule 6(1)(b)"
    checks: [present]

  - id: net_quantity
    label: Net quantity in the standard unit of weight / measure / number
    clause: "Rule 6(1)(c)"
    checks: [present, unit_standard]

  - id: mfg_date
    label: Month & year of manufacture
    clause: "Rule 6(1)(d)"
    gazette: "GSR 779(E), 02-11-2021, as amended by GSR 226(E), 28-03-2022"
    effective_from: "2022-10-01"
    checks: [present, month_year_format]
    # "or pre-packed or imported" was omitted vide GSR 779(E)/226(E), so a
    # packing-only date no longer satisfies this clause; the rule's own
    # provisos still exempt bidi/incense-sticks/certain LPG cylinders
    # (not category-driven, so not modeled here) and food/cosmetic
    # categories governed by other laws (modeled below).
    applicability:
      food:
        not_applicable: true
        law: "Food Safety and Standards Act, 2006"
        clause: "Rule 6(1)(d), first proviso"
      cosmetic:
        not_applicable: true
        law: "Drugs and Cosmetics Rules, 1945"
        clause: "Rule 6(1)(d), last proviso"

  - id: best_before
    label: Best before / use-by date (perishable commodities)
    clause: "Rule 6(1)(da)"          # inserted GSR 629(E), w.e.f. 01-01-2018
    checks: [present_if_perishable, month_year_format]

  - id: mrp
    label: Retail sale price - MRP inclusive of all taxes, Indian currency
    clause: "Rule 6(1)(e)"
    checks: [present, mrp_format]
    # Accepted formats (Rule 6 illustrations), rounded to nearest rupee / 50 paise:
    #   "Maximum retail price Rs./₹ xx.xx (inclusive of all taxes)"
    #   "Max. retail price Rs./₹ xx.xx inclusive of all taxes"
    #   "MRP Rs./₹ xx.xx incl. of all taxes"
    #   "MRP Rs./₹ xx.xx (incl. of all taxes)"

  - id: unit_sale_price
    label: Unit sale price (Rs. per standard unit - gram/kg, ml/litre, or number)
    clause: "Rule 6(11)"
    gazette: "GSR 779(E), 02-11-2021, as substituted by GSR 226(E), 28-03-2022"
    effective_from: "2022-10-01"
    checks: [present, usp_unit_basis, usp_arithmetic]
    # Not required where the retail sale price equals the unit sale price, or
    # for a single item sold by number (Rule 6(11) proviso).

  - id: consumer_care
    label: Consumer-care - name, address, telephone and e-mail for complaints (all mandatory)
    clause: "Rule 6(2)"
    gazette: "GSR 385(E), 14-05-2015"
    effective_from: "2015-05-14"
    checks: [present, contact_format]
    # As substituted by GSR 385(E): the words "if available" were removed, so
    # name, address, telephone AND e-mail are all mandatory (no optionality).

# --- Rule 7: principal display panel - letter/numeral height (in mm) ---
# Height depends on the AREA of the principal display panel in cm^2
# (Table-I as substituted by GSR 629(E), w.e.f. 01-01-2018), NOT on net weight.
# The pipeline must therefore measure BOTH the panel area (cm^2) and the glyph
# height (mm) from the image via the ArUco scale - see docs/architecture.md.
font_height_mm:
  clause: "Rule 7(2), Table-I"
  gazette: "GSR 629(E), 23-06-2017"
  effective_from: "2018-01-01"
  source_url: "https://consumeraffairs.nic.in/"
  key: principal_display_panel_area_cm2
  # Measurement is calibrated-estimate decision-support, not physical measurement.
  # Requires an in-plane known-size marker (ArUco/AprilTag) + perspective
  # correction; report height as value ± uncertainty. Reject uncalibrated images
  # (no marker => no verdict). Do NOT use barcode width as scale reference.
  requires_calibration: true
  report_uncertainty: true
  # area band (cm^2)  ->  minimum letter/numeral height (mm)
  bands:
    - area_cm2_lt: 50
      min_height_mm: 1.0
      min_height_mm_molded: 2.0      # blown/formed/molded on container
    - area_cm2_lt: 100                # 50 <= A < 100
      min_height_mm: 1.5
      min_height_mm_molded: 3.0
    - area_cm2_lt: 500                # 100 <= A < 500
      min_height_mm: 2.5
      min_height_mm_molded: 4.0
    - area_cm2_lt: 2500               # 500 <= A < 2500
      min_height_mm: 4.0
      min_height_mm_molded: 6.0
    - area_cm2_lt: null               # A >= 2500
      min_height_mm: 6.0
      min_height_mm_molded: 6.0

# Rule 7(3), as substituted by GSR 629(E) dated 23-06-2017 (w.e.f. 01-01-2018):
# width ratio ONLY. The pre-2018 text also had a flat 1mm/2mm height floor,
# but that language was replaced by Table-I above (band 1's own minimum,
# 1.0mm / 2.0mm molded, IS the floor now -- there is no separate absolute
# floor once a Table-I band applies). When no panel area is known at all, the
# engine falls back to Table-I band 1's minimum as the only floor it can cite
# (see rules/engine.py); that is not a distinct "Rule 7(3) floor".
font_absolute:
  clause: "Rule 7(3)"
  gazette: "GSR 629(E), 23-06-2017"
  effective_from: "2018-01-01"
  min_width_ratio: 0.3333            # width >= 1/3 height
  width_ratio_exceptions: ["1", "i", "I", "l"]

# Rule 7(1): tiny packages.
small_package:
  clause: "Rule 7(1)"
  capacity_le_cc: 10                  # <= 10 cm^3: PDP may be an affixed card/tape

# Rule 7(5), as substituted by GSR 629(E): even when a declaration's CONTENT is
# governed by another law (e.g. a food/cosmetic manufacturer name or mfg date -
# see each declaration's `applicability` above), these four still must meet
# Rule 7's letter-size requirements. Used to restrict Rule 7 measurement on
# food/cosmetic packages to only these declaration ids.
rule7_carveout:
  clause: "Rule 7(5)"
  declaration_ids: [net_quantity, mrp, best_before, consumer_care]

# --- Rule 8: where declarations must appear on the package ---
placement:
  - id: placement_clear_space
    label: Clear space around the net quantity declaration
    clause: "Rule 8(1), proviso"
    gazette: "LMPC Rules, 2011 (original)"
    effective_from: "2011-04-01"
    # Proviso: the area surrounding the net-quantity declaration must be free
    # of other printed information -- at least the numeral height above and
    # below, and at least twice the numeral height to the left and right.
    # This is checked as a relative (pixel-space) test; no calibration needed.

  - id: placement_grouping
    label: Grouping of declarations on the principal display panel
    clause: "Rule 2(h), 8(1)"
    gazette: "LMPC Rules, 2011 (original)"
    effective_from: "2011-04-01"
    # Rule 2(h) defines the PDP as the area carrying the grouped mandatory
    # declarations; whether the declarations on a given pack are properly
    # "grouped" is not auto-judged -- always routed to officer review.
